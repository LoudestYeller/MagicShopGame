name: Lint & Format
on: [push, pull_request]
jobs:
  luau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --check .
      - name: Selene
        uses: Kampfkarren/selene-action@v2
        with:
          args: .