name: AI PR Review (ChatGPT)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build diff for this PR
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff --unified=3 "$BASE_SHA...$HEAD_SHA" > pr.diff
          head -c 180000 pr.diff > chunk.diff
          echo "PR diff size:" $(wc -c < chunk.diff)

      - name: Ask ChatGPT to review the diff
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - << 'PY'
import json
diff = open("chunk.diff","r",encoding="utf-8",errors="ignore").read()
payload = {
  "model": "gpt-4o-mini",
  "temperature": 0.2,
  "messages": [
    {"role":"system","content":
     "You are a senior Roblox/Luau engineer and code reviewer. Rules: use game:GetService; "
     "ServiceLoader patterns; clients never create remotes; server uses RemotesService; "
     "UI visibility only via DisplayBinder/CraftingBinder; keep Luau types; pass Selene & StyLua; "
     "avoid globals; server is authority for inventory/cash."
    },
    {"role":"user","content":
     "Review this unified diff for correctness, replication/security issues, performance, and style. "
     "Return a concise Markdown report with a checklist, file-specific notes, and concrete patches if trivial.\n"
     "```diff\n"+diff+"\n```"}
  ]
}
open("payload.json","w").write(json.dumps(payload))
PY
          curl -sS https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -d @payload.json > review.json
          jq -r '.choices[0].message.content // "No content"' review.json > review.md

      - name: Post review comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md','utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });